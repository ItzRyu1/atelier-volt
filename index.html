const kmPerDay = () => {const lim=Date.now()-90*864e5, km=rides.filter(r=>new Date(r.ride_on).getTime()>=lim).reduce((a,r)=>a+(+r.km),0); return km/90};
function dueDate(s,t){
 const last=logs.find(l=>l.scooter_id===s.id&&l.task===t.id), base=last?new Date(last.done_on):new Date(s.created_at), ds=[];
 if(t.mois){const d=new Date(base); d.setMonth(d.getMonth()+t.mois); ds.push(d)}
 if(t.km){const rem=(last?last.km:s.km)+t.km-s.km, rate=kmPerDay(); if(rem<=0) ds.push(new Date()); else if(rate>.05){const d=new Date(); d.setDate(d.getDate()+Math.min(730,Math.round(rem/rate))); ds.push(d)}}
 const tomorrow=()=>{const n=new Date(); n.setDate(n.getDate()+1); return n};
 if(!ds.length){const d=new Date(); d.setDate(d.getDate()+14); return {d,est:true}}
 const d=new Date(Math.min(...ds.map(x=>x.getTime()))); return d<new Date()?{d:tomorrow(),est:false}:{d,est:t.km>0};
}

/* ====== Cartes, GPS, navigation, trajets ====== */
const D2R = Math.PI/180;
const hav = (a,b) => {const R=6371000,x=Math.sin((b.lat-a.lat)*D2R/2)**2+Math.cos(a.lat*D2R)*Math.cos(b.lat*D2R)*Math.sin((b.lon-a.lon)*D2R/2)**2; return 2*R*Math.asin(Math.sqrt(x))};
const dest = (la,lo,km,deg) => [la+km/111.32*Math.cos(deg*D2R), lo+km/111.32*Math.sin(deg*D2R)/Math.cos(la*D2R)];
const geoOK = () => localStorage.getItem("geo_ok")==="1";
async function osrm(pts){
 const r=await fetch("https://routing.openstreetmap.de/routed-bike/route/v1/driving/"+pts.map(p=>p[1]+","+p[0]).join(";")+"?overview=full&geometries=geojson&steps=true"); const j=await r.json();
 if(j.code!=="Ok") throw new Error("Aucun itinéraire trouvé"); return j.routes[0];
}
const lbl = f => {const p=f.properties; return [p.name,[p.housenumber,p.street].filter(Boolean).join(" "),[p.postcode,p.city||p.county].filter(Boolean).join(" ")].filter((x,i,a)=>x&&a.indexOf(x)===i).join(", ")};
function ac(id){
 const i=$("#"+id), box=document.createElement("div"); box.className="ac"; i.parentNode.appendChild(box); let t;
 i.addEventListener("input",()=>{delete i.dataset.lat; delete i.dataset.lon; clearTimeout(t); box.innerHTML="";
  const q=i.value.trim(); if(q.length<3) return;
  if(!$("#gc").checked){box.innerHTML=`<div class="mute" style="padding:.6rem">Coche d'abord l'accord d'envoi des adresses.</div>`;return}
  t=setTimeout(async()=>{try{const j=await (await fetch("https://photon.komoot.io/api/?lang=fr&limit=5&q="+encodeURIComponent(q))).json(); box.innerHTML="";
   (j.features||[]).forEach(f=>{const b=document.createElement("button"); b.type="button"; b.textContent=lbl(f); b.onclick=()=>{i.value=lbl(f); i.dataset.lat=f.geometry.coordinates[1]; i.dataset.lon=f.geometry.coordinates[0]; box.innerHTML=""}; box.appendChild(b)});
   if(!box.children.length) box.innerHTML=`<div class="mute" style="padding:.6rem">Aucun résultat.</div>`}catch(e){box.innerHTML=""}},350)});
}
const pos = (id,n) => {const i=$("#"+id); if(!i.dataset.lat) throw new Error("Choisis "+n+" dans la liste de suggestions."); return [+i.dataset.lat,+i.dataset.lon]};
function mapSvg(c){
 if(c.length<2) return "";
 const lo=c.map(p=>p[0]), la=c.map(p=>p[1]), x0=Math.min(...lo), y1=Math.max(...la), k=Math.cos(la[0]*D2R);
 const w=(Math.max(...lo)-x0)*k||1e-4, h=(y1-Math.min(...la))||1e-4, s=Math.min(280/w,200/h);
 const pts=c.map(p=>`${(10+(p[0]-x0)*k*s).toFixed(1)},${(10+(y1-p[1])*s).toFixed(1)}`), a=pts[0].split(","), z=pts[pts.length-1].split(",");
 return `<svg viewBox="0 0 ${Math.ceil(w*s+20)} ${Math.ceil(h*s+20)}" style="width:100%;max-height:300px;background:var(--bg);border-radius:12px;margin-top:.8rem"><polyline points="${pts.join(" ")}" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${a[0]}" cy="${a[1]}" r="6" fill="var(--ok)"/><circle cx="${z[0]}" cy="${z[1]}" r="6" fill="var(--warn)"/></svg>`;
}
const curve = t => {

 const T=t[t.length-1][0]||1, M=Math.max(30,...t.map(p=>p[3])), y=v=>(95-v/M*80).toFixed(1), x=s=>(8+s/T*284).toFixed(1);

const MOD={"left":["à gauche",-90],"right":["à droite",90],"slight left":["légèrement à gauche",-45],"slight right":["légèrement à droite",45],"sharp left":["franchement à gauche",-135],"sharp right":["franchement à droite",135],"uturn":["demi-tour",180],"straight":["tout droit",0]};
function instr(s){
 const m=s.maneuver, t=m.type, md=MOD[m.modifier]||["",0], n=s.name?" sur "+s.name:""; let txt;
 if(t==="arrive") txt="Tu es arrivé";
 else if(t==="depart") txt="Départ"+n;
 else if(/roundabout|rotary/.test(t)) txt="Au rond-point, prends la sortie "+(m.exit||"")+n;
 else if(m.modifier==="uturn") txt="Fais demi-tour"+n;
 else if(t==="continue"||t==="new name"||m.modifier==="straight") txt="Continue tout droit"+n;
 else if(t==="fork") txt="À la bifurcation, prends "+md[0]+n;
 else if(m.modifier) txt="Tourne "+md[0]+n;
 else txt="Continue"+n;

}
const flatSteps = r => r.legs.flatMap(l=>l.steps);
function dseg(q,a,b){

 const ax=X(a),ay=Y(a),bx=X(b),by=Y(b),dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy; let t=l?(-(ax*dx+ay*dy))/l:0; t=Math.max(0,Math.min(1,t));

/* ====== Série, objectif du mois, avant de partir, météo, lieux utiles, bilan ====== */
const wkey = d => {const x=typeof d==="string"?new Date(d+"T12:00:00"):new Date(d); x.setHours(12,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
function streakInfo(rs){
 rs=rs||rides; const set=new Set(rs.map(r=>wkey(r.ride_on))), keys=[...set].sort(); let best=0, run=0, prev=null;
 keys.forEach(k=>{const d=new Date(k+"T12:00:00"); run=(prev&&Math.round((d-prev)/6048e5)===1)?run+1:1; best=Math.max(best,run); prev=d});
 const w=new Date(); let n=0; if(!set.has(wkey(w))) w.setDate(w.getDate()-7);
 while(set.has(wkey(w))){n++; w.setDate(w.getDate()-7)}
 return {n,best,alive:set.has(wkey(new Date()))};
}
const BOLT='<path d="M13 2 4 14h6l-1 8 9-12h-6z"/>';
function streakCard(){
 if(!rides.length) return "";
 const s=streakInfo(); if(!s.n) return `<div class="card"><h3>Série</h3><p class="mute">Roule cette semaine pour lancer ta série.</p></div>`;
 return `<div class="card streak"><div class="ico"><svg viewBox="0 0 24 24">${BOLT}</svg></div><div><b style="font-size:1.25rem">${s.n} semaine${s.n>1?"s":""} d'affilée</b><div class="mute">${s.alive?"Tu as roulé cette semaine.":"Roule cette semaine pour continuer ta série."}</div></div></div>`;
}

const mkey = () => {const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};

const WMO = c => c===0?"Ciel dégagé":c<=3?"Nuageux":c<=48?"Brouillard":c<=57?"Bruine":c<=67?"Pluie":c<=77?"Neige":c<=82?"Averses":c<=86?"Averses de neige":"Orage";
async function weather(lat,lon){
 const j=await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(3)}&longitude=${lon.toFixed(3)}&current=temperature_2m,wind_speed_10m,weather_code&hourly=precipitation_probability&forecast_hours=4&timezone=auto`)).json();
 const c=j.current, rain=Math.max(0,...((j.hourly&&j.hourly.precipitation_probability)||[0]));
 return {t:Math.round(c.temperature_2m),w:Math.round(c.wind_speed_10m),code:c.weather_code,rain};
}
function weatherHtml(x){
 const w=[]; if(x.rain>=50||(x.code>=51&&x.code<=82)) w.push("Chaussée glissante possible : prudence et distances de freinage allongées."); if(x.w>=40) w.push("Vent fort : prudence."); if(x.t<=2) w.push("Risque de verglas.");
 return `<div class="card" style="margin:.8rem 0 0"><b>${esc(WMO(x.code))}, ${x.t} °C</b><div class="mute">Vent ${x.w} km/h, risque de pluie ${x.rain} % dans les 4 prochaines heures</div>${w.map(t=>`<div style="margin-top:.4rem;color:var(--warn)">${t}</div>`).join("")}<div class="mute" style="font-size:.8rem;margin-top:.4rem">Météo : Open-Meteo.com</div></div>`;
}
async function placesFetch(m){
 if(m.getZoom()<12){toast("Zoome pour voir les lieux utiles."); return []}
 const b=m.getBounds(), bb=[b.getSouth(),b.getWest(),b.getNorth(),b.getEast()].map(x=>x.toFixed(5)).join(",");
 const q=`[out:json][timeout:15];(node["shop"="bicycle"](${bb});node["amenity"="bicycle_parking"](${bb});node["amenity"="charging_station"](${bb}););out 80;`;
 const j=await (await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:"data="+encodeURIComponent(q)})).json(); return j.elements||[];
}
function togglePlaces(btn,mapEl){
 const m=mapEl&&mapEl._lm; if(!m) return toast("Affiche d'abord la carte.");
 if(m._pl){m.off("moveend",m._pf); m.removeLayer(m._pl); m._pl=null; btn.textContent="Afficher les lieux utiles"; return}
 const go=()=>{
  const run=async()=>{try{const els=await placesFetch(m); if(!m._pl) return; m._pl.clearLayers();
   els.forEach(e=>{const t=e.tags||{}, k=t.shop==="bicycle"?["Magasin ou réparateur de vélos","#3a3dff"]:t.amenity==="bicycle_parking"?["Parking à vélos","#0f8a64"]:["Borne de recharge","#d9480f"];
    L.circleMarker([e.lat,e.lon],{radius:7,color:"#fff",weight:2,fillColor:k[1],fillOpacity:1}).bindPopup(`<b>${esc(t.name||k[0])}</b><br>${k[0]}`).addTo(m._pl)})}catch(err){toast("Lieux utiles indisponibles pour le moment.")}};
  m._pl=L.layerGroup().addTo(m); let t; m._pf=()=>{clearTimeout(t); t=setTimeout(run,800)}; m.on("moveend",m._pf); btn.textContent="Masquer les lieux utiles"; run();
 };
 if(localStorage.getItem("places_ok")==="1") return go();
 const s=sheet("plm",`<h2>Lieux utiles</h2><p>Pour afficher les magasins de vélos, les parkings et les bornes de recharge, la zone visible de la carte est envoyée à l'API Overpass (OpenStreetMap), qui reçoit aussi ton adresse IP.</p><div class="btnrow"><button id="plY">Accepter et afficher</button><button class="sec" id="plN">Annuler</button></div>`);
 $("#plN").onclick=()=>s.remove(); $("#plY").onclick=()=>{localStorage.setItem("places_ok","1"); s.remove(); go()};
}

function vRecap(){

 const months=[...Array(12)].map((_,i)=>rs.filter(r=>+String(r.ride_on).slice(5,7)===i+1).reduce((a,r)=>a+(+r.km),0)), mi=months.indexOf(Math.max(...months)), mn=new Date(2000,mi,1).toLocaleDateString("fr-FR",{month:"long"});

 <div class="card"><h3>Km par mois</h3><svg viewBox="0 0 300 100" style="width:100%">${months.map((v,i)=>{const h=v/mx*70; return `<rect x="${i*25+3}" y="${80-h}" width="19" height="${h}" rx="4" fill="var(--acc)"/><text x="${i*25+12.5}" y="94" text-anchor="middle" font-size="8" fill="var(--mute)">${"JFMAMJJASOND"[i]}</text>`}).join("")}</svg></div>
 ${hrs?`<p class="mute">${hrs.toFixed(1)} h de roulage suivies au GPS.</p>`:""}<button id="rsh">Partager mon bilan</button>`;
 $("#ry").onchange=()=>{location.hash="#/bilan?y="+$("#ry").value};
 $("#rsh").onclick=()=>{
  const c=document.createElement("canvas"); c.width=1080; c.height=1350; const g=c.getContext("2d");

  [rs.length+" sorties",(longest?"Plus longue sortie : "+longest.toFixed(1)+" km":""),(km?"Mois le plus actif : "+mn:""),(eur?Math.round(eur)+" € d'entretien, "+ls.length+" interventions":""),(best?"Meilleure série : "+best+" semaines":"")].filter(Boolean).forEach((t,i)=>g.fillText(t,70,760+i*95));

 };
}

const batEst = b => b.km*100/(b.pct_start-b.pct_end);

 const today=new Date().toISOString().slice(0,10);
 let h=`<h1>Batterie</h1><p class="mute">Après une sortie, note la distance et le niveau de batterie au départ et à l'arrivée. L'appli estime ton autonomie réelle et repère une baisse. Le vent, le relief, ton poids et la température la font varier : regarde la tendance, pas une mesure isolée.</p>
 <div class="card"><h2>Ajouter une mesure</h2><label for="bs">Trottinette</label><select id="bs">${scooters.map(s=>`<option value="${s.id}">${esc(s.nickname||s.model)}</option>`).join("")}</select>
 <div class="row"><div><label for="bd">Date</label><input id="bd" type="date" value="${today}"></div><div><label for="bk">Distance (km)</label><input id="bk" type="number" min="1" step="0.1"></div></div>
 <div class="row"><div><label for="b1">Batterie au départ (%)</label><input id="b1" type="number" min="1" max="100"></div><div><label for="b2">Batterie à l'arrivée (%)</label><input id="b2" type="number" min="0" max="99"></div></div>
 <button id="bsv">Enregistrer</button></div>`;
 scooters.forEach(s=>{const e=bat.filter(b=>b.scooter_id===s.id).sort((a,b)=>String(a.logged_on).localeCompare(String(b.logged_on)));
  if(!e.length) return;
  const v=e.map(batEst), last=v[v.length-1], prev=v.slice(0,-1), avg=prev.length?prev.reduce((a,b)=>a+b,0)/prev.length:null, mx=Math.max(...v)*1.1;
  const pts=v.map((x,i)=>`${(20+(v.length>1?i/(v.length-1):.5)*260).toFixed(1)},${(95-x/mx*80).toFixed(1)}`);
  const drop=avg&&prev.length>=2&&last<avg*.8;
  h+=`<div class="card"><h3>${esc(s.nickname||s.model)}</h3><p><b>${last.toFixed(1)} km</b> d'autonomie estimée (dernière mesure)${avg?`, moyenne précédente ${avg.toFixed(1)} km`:""}</p>
  ${drop?`<div class="warnbox" style="margin:0 0 .6rem">Autonomie en baisse d'environ ${Math.round((1-last/avg)*100)} % : refais une mesure dans des conditions comparables et, si ça persiste, fais contrôler la batterie.</div>`:""}
  <svg viewBox="0 0 300 110" style="width:100%"><polyline fill="none" stroke="var(--acc)" stroke-width="2.5" points="${pts.join(" ")}"/>${pts.map(p=>`<circle cx="${p.split(",")[0]}" cy="${p.split(",")[1]}" r="4" fill="var(--acc)"/>`).join("")}</svg>
  ${e.slice(-6).reverse().map(b=>`<div class="mute" style="display:flex;justify-content:space-between;gap:.5rem"><span>${esc(b.logged_on)}, ${b.km} km, ${b.pct_start} à ${b.pct_end} %</span><a href="#" data-bx="${b.id}">Supprimer</a></div>`).join("")}</div>`});
 $("#app").innerHTML=h;
 $("#bsv").onclick=async()=>{const km=+$("#bk").value, p1=+$("#b1").value, p2=+$("#b2").value;
  if(!(km>0)||!(p1>p2)||p1-p2<10) return toast("Saisis une distance et une baisse d'au moins 10 % de batterie.");
  const {error}=await sb.from("battery_logs").insert({user_id:user.id,scooter_id:$("#bs").value,logged_on:$("#bd").value,km,pct_start:p1,pct_end:p2}); error?toast("Erreur : "+error.message):route()};
 document.querySelectorAll("[data-bx]").forEach(a=>a.onclick=async e=>{e.preventDefault(); await sb.from("battery_logs").delete().eq("id",a.dataset.bx); route()});
}

function carnetPdf(s){
 if(!window.jspdf) return toast("Génération du PDF indisponible.");
 const d=new window.jspdf.jsPDF({unit:"mm",format:"a4"}); let y=22;
 const T=(t,x,sz,b)=>{d.setFontSize(sz||11); d.setFont("helvetica",b?"bold":"normal"); d.text(String(t),x,y)};
 const l=logs.filter(x=>x.scooter_id===s.id).sort((a,b)=>String(a.done_on).localeCompare(String(b.done_on)));
 const eur=l.reduce((a,x)=>a+(+x.cost||0),0), fr=x=>new Date(x).toLocaleDateString("fr-FR");
 T("Carnet d'entretien",15,22,true); y+=9; T(s.nickname?s.nickname+" ("+s.model+")":s.model,15,13); y+=7;
 T("Kilometrage : "+s.km+" km",15); y+=6; if(s.serial){T("Numero de serie : "+s.serial,15); y+=6}
 T("Interventions notees : "+l.length+"   Depenses : "+eur.toFixed(2)+" EUR",15); y+=6; T("Etabli le "+fr(Date.now()),15); y+=12;
 T("Date",15,10,true); T("Km",40,10,true); T("Intervention",58,10,true); T("Cout",160,10,true); y+=2; d.line(15,y,195,y); y+=6;
 l.forEach(x=>{const t=TASKS.find(z=>z.id===x.task), note=d.splitTextToSize((t?t.n:"Autre intervention")+(x.note?" - "+x.note:""),98);
  if(y+note.length*5>278){d.addPage(); y=20}
  T(fr(x.done_on),15,10); T(x.km,40,10); d.setFontSize(10); d.text(note,58,y); T(x.cost!=null?(+x.cost).toFixed(2)+" EUR":"",160,10); y+=note.length*5+2});
 if(!l.length){T("Aucune intervention notee.",15,10)}
 const n=d.getNumberOfPages(); for(let i=1;i<=n;i++){d.setPage(i); d.setFontSize(8); d.setFont("helvetica","normal"); d.text("Document etabli a partir des informations declarees par le proprietaire via L'Atelier Volt. Il ne constitue pas un certificat.",15,290)}
 d.save("carnet-"+(s.nickname||s.model).replace(/[^A-Za-z0-9]+/g,"-").slice(0,40)+".pdf");
}

<h3>5. Compte</h3><p>Tu fournis une adresse email valide et un mot de passe. Tu es responsable de leur confidentialité et de toute activité sur ton compte. Le compte est personnel et non cessible. Préviens-nous sans délai en cas d'usage frauduleux. Un mot de passe oublié peut être réinitialisé par email.</p>
<h3>6. Gratuité</h3><p>Le service est gratuit. Si une offre payante était proposée un jour, elle ferait l'objet de conditions distinctes et ne s'appliquerait qu'avec ton accord exprès.</p>
<h3>7. Règles d'usage</h3><p>Tu t'engages à : utiliser le service de façon licite et loyale ; ne pas perturber ou surcharger son fonctionnement ; ne pas tenter d'accéder aux comptes ou données d'autres utilisateurs ; ne pas collecter de données de façon automatisée ; ne pas saisir de contenu illicite ni de données personnelles de tiers dans tes notes.</p>
<h3>8. Tes données de carnet</h3><p>Les informations que tu saisis (trottinettes, kilométrages, assurance, numéros de série, interventions, coûts, notes) restent à toi et sont privées : seul ton compte y a accès. Tu accordes à l'Éditeur uniquement le droit de les stocker et de les traiter pour te fournir le service. Tu peux les exporter et les supprimer à tout moment depuis « Compte ». Il t'appartient de conserver une copie si tu en as besoin.</p>
<h3>8 bis. Pseudo et classements</h3><p>Le pseudo est demandé à la création du compte. Il doit être choisi librement mais ne doit pas usurper l'identité d'un tiers, être injurieux, discriminatoire ou illicite, ni révéler de donnée personnelle. L'Éditeur peut modifier ou retirer un pseudo contraire à ces règles. Le pseudo n'est visible des autres utilisateurs que si tu choisis d'apparaître aux classements. Deux classements existent : « tracé GPS » (sorties enregistrées avec le suivi GPS) et « déclaré » (km saisis à la main, non vérifiés). Le classement « tracé GPS » n'est pas une certification : il repose sur des données de ton appareil, que l'Éditeur ne contrôle que de façon automatique et limitée. Il n'est associé à aucun gain. Toute tentative de fausser un classement (position simulée, trajet dans un autre véhicule, données inventées) peut entraîner la suppression de tes sorties ou de ton compte.</p>

<h3>8 quater. Itinéraires</h3><p>Les itinéraires proposés sont générés automatiquement à partir de données OpenStreetMap et d'un calcul prévu pour le vélo. Ils peuvent comporter des erreurs, passer par des voies interdites ou dangereuses pour une trottinette, ou être indisponibles. Tu restes seul responsable du trajet que tu empruntes, de ta vigilance et du respect du Code de la route. L'estimation de consommation de batterie est indicative.</p>
<h3>8 quinquies. Navigation, calendrier et rappels</h3><p>La navigation est une aide : elle ne remplace ni ta vigilance, ni la signalisation, ni le Code de la route. Fixe ton téléphone avec un support et ne le manipule jamais en roulant. Les instructions et les itinéraires peuvent être inexacts ou inadaptés aux trottinettes. L'écran doit rester allumé et la page ouverte au premier plan ; le suivi peut s'interrompre sans que l'Éditeur puisse le garantir. Les événements de calendrier sont ajoutés une seule fois et ne se mettent pas à jour ; les rappels par email sont facultatifs et peuvent comporter des retards ou des erreurs.</p>
<h3>8 sexies. Carnet PDF et fiche de revente</h3><p>Le carnet en PDF et la fiche de revente sont établis à partir des informations que tu as saisies. Ils ne constituent ni un certificat ni une garantie de l'état de la trottinette. Tu es seul responsable de l'exactitude des annonces que tu publies.</p>
<h3>8 septies. Classements privés, signalements et modération</h3><p>Tu peux créer ou rejoindre des classements privés (5 au maximum par personne, 50 membres par classement). Le nom d'un classement doit respecter les mêmes règles que les pseudos ; le créateur peut retirer un membre, désactiver ou renouveler le lien d'invitation et supprimer le classement. En rejoignant un classement, tu acceptes que ton pseudo et tes totaux de km soient visibles de ses membres. Tu peux signaler un pseudo ou un nom de classement depuis les classements. L'Éditeur peut, en cas de manquement aux CGU ou de contenu illicite, retirer un contenu, adresser un rappel à l'ordre ou un avertissement, suspendre temporairement ou définitivement un compte, ou le supprimer. Sauf urgence ou obligation légale, la raison de la décision t'est communiquée dans l'appli et par email ; tu peux la contester en écrivant à l'adresse de contact, et ta demande sera examinée par une personne. L'Éditeur peut aussi t'écrire pour des raisons liées à ton compte ou au fonctionnement du service.</p>
<h3>9. Informations indicatives et sécurité</h3><p>Les intervalles d'entretien, tâches, guides, rappels, listes de modèles et suivi de l'assurance sont fournis <b>à titre indicatif</b> ; ils peuvent contenir des erreurs ou être incomplets, et ne remplacent ni le manuel du constructeur, ni l'avis d'un professionnel, ni tes obligations légales. L'entretien des freins, de la batterie, des fixations et des pneus touche à ta sécurité : en cas de doute, adresse-toi à un réparateur qualifié. Tu es seul responsable de l'état de ta trottinette, de la souscription d'une assurance de responsabilité civile et du respect du Code de la route et de la réglementation applicable aux engins de déplacement personnel motorisés.</p>

<h3>11. Disponibilité et évolution du service</h3><p>Le service est fourni « en l'état », sans garantie de disponibilité continue. Des interruptions peuvent avoir lieu pour maintenance. L'Éditeur peut faire évoluer, suspendre ou arrêter le service ; en cas d'arrêt définitif, il t'en informe au moins 30 jours à l'avance et te permet d'exporter tes données.</p>

<h3>13. Propriété intellectuelle et marques</h3><p>Voir les <a href="#/mentions">mentions légales</a>. Les marques citées appartiennent à leurs propriétaires et le service n'est affilié à aucune d'elles.</p>
<h3>14. Données personnelles</h3><p>Le traitement de tes données est décrit dans la <a href="#/confidentialite">politique de confidentialité</a> et la <a href="#/cookies">politique relative aux cookies</a>.</p>
<h3>15. Divers</h3><p>Si une clause des CGU est déclarée nulle, les autres restent applicables. Le fait de ne pas exercer un droit n'emporte pas renonciation. Les CGU sont rédigées en français ; seule cette version fait foi. Les données enregistrées par le service font foi, sauf preuve contraire, des opérations réalisées.</p>
<h3>16. Réclamations, droit applicable et juridiction</h3><p>Pour toute réclamation, écris d'abord à l'Éditeur (voir les mentions légales). Le service étant proposé gratuitement par un particulier, sans activité commerciale, aucun médiateur de la consommation n'est désigné à ce jour ; s'il en était désigné un, ses coordonnées seraient indiquées ici. Tu peux à tout moment saisir les tribunaux compétents et, pour un litige transfrontalier au sein de l'Union européenne, le Centre européen des consommateurs France. Les CGU sont soumises au droit français. Si tu es consommateur résidant dans l'Union européenne, tu conserves la protection des dispositions impératives de ton pays de résidence et peux saisir les tribunaux de ton domicile. À défaut, les tribunaux français sont compétents.</p>`);

 sessionStorage.setItem("pk_shown","1");
 try{ if(sb.auth.passkey&&sb.auth.passkey.list){const {data}=await sb.auth.passkey.list(); if(data&&data.length) return} }catch(e){}
 afterSplash(askPasskey);
}
function askPasskey(){
 if(document.getElementById("pkm")||!user) return;
 const m=document.createElement("div"); m.id="pkm"; m.className="modal"; m.setAttribute("role","dialog"); m.setAttribute("aria-modal","true"); m.setAttribute("aria-labelledby","pkt");
 m.innerHTML=`<div class="sheet"><div class="ico big">${KEY}</div><h2 id="pkt">Connecte-toi plus vite avec une passkey</h2><p>Une passkey remplace ton mot de passe : tu te connectes avec ton empreinte, ton visage ou le code de ton appareil. C'est plus rapide et plus sûr, car il n'y a rien à retenir et rien qui puisse être volé ou deviné.</p><p class="mute">Tu pourras aussi en ajouter une plus tard depuis Compte.</p><label class="chk"><input type="checkbox" id="pkX"><span>Ne plus me le proposer</span></label><div class="btnrow"><button id="pkY">Ajouter une passkey</button><button class="sec" id="pkN">Plus tard</button></div></div>`;
 document.body.appendChild(m);
 const kd=e=>{if(e.key==="Escape") close()};
 const close=()=>{if($("#pkX")&&$("#pkX").checked) localStorage.setItem("pk_never_"+user.id,"1"); m.remove(); document.removeEventListener("keydown",kd)};
 document.addEventListener("keydown",kd);
 $("#pkN").onclick=close; m.addEventListener("click",e=>{if(e.target===m) close()});
 $("#pkY").onclick=async()=>{const {error}=await sb.auth.registerPasskey(); close(); toast(error?"Passkey : "+error.message:"Passkey ajoutée.")};
 $("#pkY").focus();
}

/* ====== Démarrage ====== */
if(!localStorage.getItem("ck")) $("#cookie").style.display="block";
sb.auth.onAuthStateChange((ev,session)=>{user=session?session.user:null; if(ev==="SIGNED_IN"&&/connexion|inscription|bienvenue/.test(location.hash)) location.hash="#/accueil"; aalOK=null; if(ev==="SIGNED_IN"&&!REDUCED&&!sessionStorage.getItem("splash")){sessionStorage.setItem("splash","1"); splashPending=true}
 if(ev==="SIGNED_OUT"){sessionStorage.removeItem("splash"); sessionStorage.removeItem("pk_shown"); location.hash="#/bienvenue"} route()});
</script>
</body>
</html>
