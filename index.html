<style>

:root{--bg:#f1f3fb;--card:#fff;--ink:#12132b;--mute:#5d6086;--line:#e0e3f2;--acc:#3a3dff;--acc2:#2a2ce0;--acc-ink:#fff;--soft:#e9ebff;--warn:#d9480f;--ok:#0f8a64;--tag-ink:#fff;--r:20px}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Space Grotesk","Avenir Next","Segoe UI",system-ui,sans-serif}

header{display:flex;justify-content:space-between;align-items:center;padding:calc(.7rem + env(safe-area-inset-top,0px)) 1.1rem .7rem}

main{max-width:780px;margin:0 auto;padding:.6rem 1rem 8rem}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(.8rem + env(safe-area-inset-bottom,0px));width:min(94%,520px);z-index:5;display:flex;gap:.15rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.3rem;box-shadow:0 12px 32px rgba(18,19,43,.16)}

.panel span{opacity:.85;font-weight:600}.panel h1{color:#fff;margin:.2rem 0 1rem}
.panel .big{font-size:3.4rem;font-weight:800;letter-spacing:-.05em;line-height:1}.panel small{font-size:1rem;font-weight:500;opacity:.8;letter-spacing:0}

/* Accueil visiteurs */
body.land header{background:#3a3dff;color:#fff}body.land header .btn{background:#fff;color:#3a3dff;margin:0}

.lp-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));column-gap:2.5rem;margin-top:1.4rem}

.lp-band{max-width:1000px;margin:3.4rem auto 0;background:#1b1d55;color:#fff;border-radius:30px;padding:2.2rem 1.5rem}

html,body{max-width:100%;overflow-x:hidden}
button,.btn{transition:background .15s,transform .1s}button:active,.btn:active{transform:scale(.97)}
nav a{transition:background .2s,color .2s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.96)}}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) rotate(-6deg)}}
@keyframes drive{from{opacity:0;transform:translateX(-70px)}}
@keyframes dash{to{stroke-dashoffset:26}}

#app>*{animation:rise .35s both}
.bar i{transform-origin:left;animation:grow .9s .15s cubic-bezier(.2,.8,.2,1) both}
.lp-in>*{min-width:0}
.lp-hero h1{animation:rise .7s both}.lp-hero p{animation:rise .7s .1s both}.lp-cta{animation:rise .7s .2s both}

.spin{animation:spin 2.4s linear infinite}
.modal{position:fixed;inset:0;z-index:40;background:rgba(12,13,34,.55);backdrop-filter:blur(4px);display:grid;place-items:center;padding:1rem;animation:fade .25s}
.sheet{background:var(--card);border-radius:26px;padding:1.6rem;max-width:420px;width:100%;animation:pop .4s cubic-bezier(.2,.9,.3,1.1)}
.sheet p{margin:.4rem 0}.ico.big{width:60px;height:60px;border-radius:20px;margin-bottom:1rem}.ico.big svg{width:30px;height:30px}
#splash{position:fixed;inset:0;z-index:50;background:#3a3dff radial-gradient(rgba(255,255,255,.13) 1.3px,transparent 1.4px) 0 0/24px 24px;color:#fff;display:grid;place-items:center;text-align:center;cursor:pointer;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
.sp-in{display:grid;gap:1.1rem;justify-items:center;padding:2rem}
.sp-ring{width:96px;height:96px}.sp-ring svg{width:100%;height:100%}
.sp-ring .arc{transform-box:fill-box;transform-origin:center;animation:spin 1.1s linear infinite}
.sp-hello{font-size:clamp(2.2rem,9vw,3.4rem);font-weight:800;letter-spacing:-.045em;line-height:1.02;animation:rise .7s .15s both}
.sp-bar{width:min(240px,60vw);height:5px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}

.sp-msg{color:#d6d9ff;min-height:1.5em}.sp-skip{font-size:.8rem;color:#a9afff}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@keyframes marq{to{transform:translateX(-50%)}}
@keyframes float{50%{transform:translateY(-9px)}}
@keyframes beam{50%{opacity:.07}}

.lp-art{margin:0 -1.2rem}
@media(min-width:820px){.lp-art{margin:0}}
.lp-chip{position:absolute;left:6%;top:4%;background:#fff;color:#12132b;border-radius:999px;padding:.4rem .95rem;font-weight:700;font-size:.9rem;box-shadow:0 10px 26px rgba(8,9,60,.3);animation:float 4s ease-in-out infinite}
.beam{animation:beam 3s ease-in-out infinite}
.mq-wrap{padding-top:2.2rem}.mq-wrap>p{text-align:center;margin:0 1rem}
.mq{overflow:hidden;padding-top:1.3rem;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mq-t{display:flex;width:max-content;align-items:center;animation:marq 42s linear infinite}

<script>
/* ====== CONFIG : à remplacer par tes valeurs Supabase (Project Settings > API) ====== */
const SUPABASE_URL = "https://VOTRE-PROJET.supabase.co";
const SUPABASE_ANON_KEY = "VOTRE_CLE_ANON_PUBLIQUE";
/* ====== Infos légales : à compléter ====== */
const EDITEUR = {nom:"[NOM PRÉNOM]", adresse:"[ADRESSE POSTALE]", email:"[EMAIL DE CONTACT]"};

const DEMO = SUPABASE_URL.includes("VOTRE");
function mockSb(){
 const g=k=>JSON.parse(localStorage.getItem("demo_"+k)||"[]"), p=(k,v)=>localStorage.setItem("demo_"+k,JSON.stringify(v)), ok=()=>Promise.resolve({});
 let cb=()=>{}; const U=()=>({id:"demo",email:"demo@exemple.fr",user_metadata:JSON.parse(localStorage.getItem("demo_meta")||"{}")});
 const tb=t=>({
  select(){const r=Promise.resolve({data:g(t)});r.order=()=>Promise.resolve({data:g(t)});return r},
  upsert(r){const a=g(t),o=a.find(x=>x.id===r.id);p(t,a.filter(x=>x.id!==r.id).concat({...o,...r}));return ok()},
  insert(r){const a=g(t);a.push({...r,id:crypto.randomUUID(),created_at:new Date().toISOString()});p(t,a);return ok()},
  update(v){return {eq(c,x){p(t,g(t).map(r=>r[c]==x?{...r,...v}:r));return ok()}}},
  delete(){return {eq(c,x){p(t,g(t).filter(r=>r[c]!=x));if(t=="scooters")p("logs",g("logs").filter(r=>r.scooter_id!=x));return ok()}}}});
 const auth={signInWithPassword(){localStorage.setItem("demo_on","1");cb("SIGNED_IN",{user:U()});return ok()},
  signUp(a){localStorage.setItem("demo_meta",JSON.stringify(((a||{}).options||{}).data||{}));return auth.signInWithPassword()},signOut(){localStorage.removeItem("demo_on");cb("SIGNED_OUT",null);return ok()},
  resetPasswordForEmail:ok,updateUser(d){const m=JSON.parse(localStorage.getItem("demo_meta")||"{}");localStorage.setItem("demo_meta",JSON.stringify({...m,...((d||{}).data||{})}));return Promise.resolve({data:{user:U()}})},signInWithOtp:ok,registerPasskey(){localStorage.setItem("demo_pk","1");return ok()},passkey:{list:()=>Promise.resolve({data:localStorage.getItem("demo_pk")?[{id:1}]:[]})},signInWithPasskey(){return auth.signInWithPassword()},signInWithOAuth(){return auth.signInWithPassword()},onAuthStateChange(f){cb=f;setTimeout(()=>f("INITIAL_SESSION",localStorage.getItem("demo_on")?{user:U()}:null))}};
 return {from:tb,auth,rpc(n,a){ if(n==="username_available") return Promise.resolve({data:true});
  if(n==="leaderboard"){const pr=g("profiles")[0],k=(a||{}).kind,rd=g("rides").filter(r=>r.source===k),mo=new Date().toISOString().slice(0,7),sm=x=>x.reduce((y,r)=>y+(+r.km),0);
   const me=pr&&pr.public_ranking&&pr.username?[{username:pr.username,km_month:sm(rd.filter(r=>r.ride_on.startsWith(mo))),km_total:sm(rd),rides:rd.length}]:[];
   const fake=k==="gps"?[{username:"exemple_camille",km_month:64.2,km_total:402,rides:24},{username:"exemple_lea",km_month:18.9,km_total:131,rides:9}]:[{username:"exemple_malik",km_month:120,km_total:2210,rides:60},{username:"exemple_camille",km_month:84.5,km_total:612,rides:31}];
   return Promise.resolve({data:[...fake,...me]})}
  ["scooters","logs","rides","profiles"].forEach(k=>localStorage.removeItem("demo_"+k));return ok()}};
}
const sb = DEMO ? mockSb() : supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {auth:{experimental:{passkey:true}}});
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toast = t => { const m=$("#msg"); m.textContent=t; m.style.display="block"; setTimeout(()=>m.style.display="none",3500); };

/* ====== Modèles ====== */
const MODELS = {
 "Kukirin":["G2 Pro","G2 Max","G3","G3 Pro","G4","G5","M4 Pro","M5","S1 Pro"],
 "Xiaomi":["Mi Electric Scooter 1S","Mi Electric Scooter Essential","Mi Electric Scooter Pro 2","Mi Electric Scooter 3","Electric Scooter 4 Lite","Electric Scooter 4","Electric Scooter 4 Pro","Electric Scooter 4 Ultra"],
 "Ninebot (Segway)":["ES2","ES4","Max G30","Max G30D","Max G2","F2","F2 Pro","E2 Pro","P65","P100","GT1"],
 "Dualtron":["Mini","Spider","Storm","Thunder 3","Victor","Achilleus","Eagle"],
 "Kaabo":["Mantis","Mantis King GT","Wolf Warrior"],
 "Vsett":["8","9","10","11+"],
 "Minimotors (Speedway)":["Speedway 4","Speedway 5","Speedway Leger"],
 "Teverun":["Blade Mini","Fighter Mini"],
 "Nami":["Burn-E","Klima"],
 "Mercane":["WideWheel","WideWheel Pro"],

/* ====== Calculs ====== */
const calc = s => TASKS.map(t=>{
 const last=logs.find(l=>l.scooter_id===s.id&&l.task===t.id); let r,why;
 if(last){const rk=t.km?(s.km-last.km)/t.km:0, rm=t.mois?(Date.now()-new Date(last.done_on))/2629800000/t.mois:0; r=Math.max(rk,rm); why=`Dernière fois : ${last.done_on} (${last.km} km)`}
 else{r=t.mois?(Date.now()-new Date(s.created_at))/2629800000/t.mois:0; why="Pas encore noté"}
 return {t,r,why}}).sort((a,b)=>b.r-a.r);
const st = r => r>=1?["late","À faire"]:r>=.8?["soon","Bientôt"]:["fine","OK"];
const CHECK = `<div class="card"><h2>Avant de rouler</h2><label class="chk"><input type="checkbox"><span>Pneus en bon état et correctement gonflés</span></label><label class="chk"><input type="checkbox"><span>Frein avant et frein arrière répondent bien</span></label><label class="chk"><input type="checkbox"><span>Éclairage, feu stop et avertisseur sonore fonctionnent</span></label><label class="chk"><input type="checkbox"><span>Guidon, potence et pliage bien verrouillés</span></label><label class="chk"><input type="checkbox"><span>Batterie assez chargée pour le trajet</span></label><label class="chk"><input type="checkbox"><span>Casque et protections (fortement recommandés)</span></label></div>`;

/* ====== Cartes, GPS, trajets ====== */
const D2R = Math.PI/180;
const hav = (a,b) => {const R=6371000,x=Math.sin((b.lat-a.lat)*D2R/2)**2+Math.cos(a.lat*D2R)*Math.cos(b.lat*D2R)*Math.sin((b.lon-a.lon)*D2R/2)**2; return 2*R*Math.asin(Math.sqrt(x))};
const dest = (la,lo,km,deg) => [la+km/111.32*Math.cos(deg*D2R), lo+km/111.32*Math.sin(deg*D2R)/Math.cos(la*D2R)];
async function osrm(pts){
 const r=await fetch("https://routing.openstreetmap.de/routed-bike/route/v1/driving/"+pts.map(p=>p[1]+","+p[0]).join(";")+"?overview=full&geometries=geojson"); const j=await r.json();
 if(j.code!=="Ok") throw new Error("Aucun itinéraire trouvé"); return j.routes[0];
}
const lbl = f => {const p=f.properties; return [p.name,[p.housenumber,p.street].filter(Boolean).join(" "),[p.postcode,p.city||p.county].filter(Boolean).join(" ")].filter((x,i,a)=>x&&a.indexOf(x)===i).join(", ")};
function ac(id){
 const i=$("#"+id), box=document.createElement("div"); box.className="ac"; i.parentNode.appendChild(box); let t;
 i.addEventListener("input",()=>{delete i.dataset.lat; delete i.dataset.lon; clearTimeout(t); box.innerHTML="";
  const q=i.value.trim(); if(q.length<3) return;
  if(!$("#gc").checked){box.innerHTML=`<div class="mute" style="padding:.6rem">Coche d'abord l'accord d'envoi des adresses.</div>`;return}
  t=setTimeout(async()=>{try{const j=await (await fetch("https://photon.komoot.io/api/?lang=fr&limit=5&q="+encodeURIComponent(q))).json(); box.innerHTML="";
   (j.features||[]).forEach(f=>{const b=document.createElement("button"); b.type="button"; b.textContent=lbl(f); b.onclick=()=>{i.value=lbl(f); i.dataset.lat=f.geometry.coordinates[1]; i.dataset.lon=f.geometry.coordinates[0]; box.innerHTML=""}; box.appendChild(b)});
   if(!box.children.length) box.innerHTML=`<div class="mute" style="padding:.6rem">Aucun résultat.</div>`}catch(e){box.innerHTML=""}},350)});
}
const pos = (id,n) => {const i=$("#"+id); if(!i.dataset.lat) throw new Error("Choisis "+n+" dans la liste de suggestions."); return [+i.dataset.lat,+i.dataset.lon]};
function mapSvg(c){
 if(c.length<2) return "";
 const lo=c.map(p=>p[0]), la=c.map(p=>p[1]), x0=Math.min(...lo), y1=Math.max(...la), k=Math.cos(la[0]*D2R);
 const w=(Math.max(...lo)-x0)*k||1e-4, h=(y1-Math.min(...la))||1e-4, s=Math.min(280/w,200/h);
 const pts=c.map(p=>`${(10+(p[0]-x0)*k*s).toFixed(1)},${(10+(y1-p[1])*s).toFixed(1)}`), a=pts[0].split(","), z=pts[pts.length-1].split(",");
 return `<svg viewBox="0 0 ${Math.ceil(w*s+20)} ${Math.ceil(h*s+20)}" style="width:100%;max-height:300px;background:var(--bg);border-radius:12px;margin-top:.8rem"><polyline points="${pts.join(" ")}" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${a[0]}" cy="${a[1]}" r="6" fill="var(--ok)"/><circle cx="${z[0]}" cy="${z[1]}" r="6" fill="var(--warn)"/></svg>`;
}
const curve = t => {
 if(!t||t.length<2) return "";
 const T=t[t.length-1][0]||1, M=Math.max(30,...t.map(p=>p[3])), y=v=>(95-v/M*80).toFixed(1), x=s=>(8+s/T*284).toFixed(1);
 return `<svg viewBox="0 0 300 110" style="width:100%;margin-top:.6rem"><line x1="8" x2="292" y1="${y(25)}" y2="${y(25)}" stroke="var(--warn)" stroke-dasharray="4 4"/><text x="292" y="${+y(25)-3}" text-anchor="end" font-size="10" fill="var(--warn)">25 km/h</text><polyline fill="none" stroke="var(--acc)" stroke-width="2" points="${t.map(p=>x(p[0])+","+y(p[3])).join(" ")}"/></svg>`;
};

/* --- Suivi GPS --- */
let tk=null, rt=null;
function tkStart(sid){
 if(!navigator.geolocation){toast("Géolocalisation indisponible sur cet appareil.");return false}
 tk={pts:[],dist:0,mov:0,t0:Date.now(),v:0,vmax:0,vs:[],last:null,sid:sid||null};
 tk.wid=navigator.geolocation.watchPosition(onPos,e=>{toast("GPS : "+(e.code===1?"autorisation refusée.":"position indisponible."));if(e.code===1){tkStop();tk=null;if($("#tkp"))tkRender()}},{enableHighAccuracy:true,maximumAge:0,timeout:20000});
 const wl=()=>{if(navigator.wakeLock) navigator.wakeLock.request("screen").then(l=>{if(tk)tk.wl=l}).catch(()=>{})};
 wl(); tk.vc=()=>{if(document.visibilityState==="visible"&&tk&&!tk.done) wl()}; document.addEventListener("visibilitychange",tk.vc);
 tk.tick=setInterval(tkDraw,1000); return true;
}
function onPos(p){
 if(!tk||tk.done) return; const c=p.coords; if(c.accuracy>40) return;
 const q={t:p.timestamp,lat:c.latitude,lon:c.longitude};
 if(tk.last){const dt=(q.t-tk.last.t)/1000; if(dt<1) return; const d=hav(tk.last,q), v=d/dt*3.6;
  if(v>60) return;
  if(d<4){tk.v=0;return}
  tk.dist+=d; tk.mov+=dt; tk.v=v; tk.vs.push(v); if(tk.vs.length>3) tk.vs.shift();
  tk.vmax=Math.max(tk.vmax,tk.vs.reduce((a,b)=>a+b,0)/tk.vs.length)}
 tk.pts.push({t:q.t,lat:q.lat,lon:q.lon,v:tk.v}); tk.last=q;
}
function tkStop(){
 if(!tk||tk.done) return; navigator.geolocation.clearWatch(tk.wid); clearInterval(tk.tick); document.removeEventListener("visibilitychange",tk.vc);
 if(tk.wl) tk.wl.release().catch(()=>{}); tk.end=Date.now(); tk.done=true;
}
function tkDraw(){
 if(!tk||tk.done) return; const e=document.getElementById("l-v"); if(!e) return;
 e.textContent=tk.v.toFixed(1); $("#l-d").textContent=(tk.dist/1000).toFixed(2);
 const s=Math.round((Date.now()-tk.t0)/1000); $("#l-t").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); $("#l-n").textContent=tk.pts.length;
}
function tkPanel(){
 if(!tk) return `<p class="mute">Lance le suivi au départ, garde cette page ouverte au premier plan avec l'écran allumé, puis termine à l'arrivée. Ne manipule pas ton téléphone en roulant. Ta position n'est lue que pendant le suivi.</p>
 <label for="tsc">Trottinette</label><select id="tsc"><option value="">Aucune</option>${scooters.map(s=>`<option value="${s.id}">${esc(s.nickname||s.model)}</option>`).join("")}</select><button id="t0">Démarrer le suivi</button>`;
 if(!tk.done) return `<div class="stats"><div class="card stat"><b id="l-v">0</b>km/h</div><div class="card stat"><b id="l-d">0.00</b>km</div><div class="card stat"><b id="l-t">0:00</b>durée</div><div class="card stat"><b id="l-n">0</b>points GPS</div></div><button class="danger" id="t1">Terminer</button>`;
 const km=tk.dist/1000, dur=(tk.end-tk.t0)/1000, avg=tk.mov?km/(tk.mov/3600):0;
 if(km<.2) return `<p>Trajet trop court pour être enregistré.</p><button class="sec" id="tx">Fermer</button>`;
 return `<div class="stats"><div class="card stat"><b>${km.toFixed(2)}</b>km</div><div class="card stat"><b>${Math.round(dur/60)}</b>minutes</div><div class="card stat"><b>${avg.toFixed(1)}</b>km/h en moyenne</div><div class="card stat"><b>${tk.vmax.toFixed(1)}</b>km/h maximum</div></div>
 ${curve(tk.pts.map(p=>[(p.t-tk.t0)/1000,0,0,p.v]))}${mapSvg(tk.pts.map(p=>[p.lon,p.lat]))}
 <label class="chk"><input id="tm" type="checkbox" checked><span>Masquer les 150 premiers et derniers mètres du tracé enregistré (protège ton domicile).</span></label>
 <label class="chk"><input id="ta" type="checkbox" checked><span>Ajouter ces km au compteur de la trottinette</span></label>
 <button id="ts">Enregistrer la sortie</button><button class="sec" id="tx">Supprimer</button>`;
}
function tkRender(){$("#tkp").innerHTML=tkPanel(); const g=id=>document.getElementById(id);
 if(g("t0")) g("t0").onclick=()=>{if(tkStart($("#tsc").value)) tkRender()};
 if(g("t1")) g("t1").onclick=()=>{tkStop(); tkRender()};
 if(g("tx")) g("tx").onclick=()=>{tk=null; tkRender()};
 if(g("ts")) g("ts").onclick=tkSave;
}
async function tkSave(){

 if(avg>45) return toast("Vitesse moyenne incohérente pour une trottinette : sortie non enregistrée.");
 let pts=tk.pts; if($("#tm").checked&&pts.length){const a=pts[0], z=pts[pts.length-1]; pts=pts.filter(p=>hav(a,p)>150&&hav(z,p)>150)}
 const st=Math.ceil(pts.length/300)||1, track=pts.filter((_,i)=>i%st===0).map(p=>[Math.round((p.t-tk.t0)/1000),+p.lat.toFixed(5),+p.lon.toFixed(5),+p.v.toFixed(1)]);
 const {error}=await sb.from("rides").insert({user_id:user.id,scooter_id:tk.sid,ride_on:new Date().toISOString().slice(0,10),km:+km.toFixed(1),title:"Sortie GPS",source:"gps",duration_s:dur,max_kmh:+tk.vmax.toFixed(1),avg_kmh:+avg.toFixed(1),track});
 if(error) return toast("Erreur : "+error.message);
 if(tk.sid&&$("#ta").checked){const s=scooters.find(x=>x.id===tk.sid); if(s) await sb.from("scooters").update({km:Math.round(s.km+km)}).eq("id",tk.sid)}

<h3>4. Transferts hors de l'Union européenne</h3><p>Certains prestataires peuvent traiter des données hors de l'Union européenne, notamment aux États-Unis. Ces transferts reposent sur une décision d'adéquation de la Commission européenne (cadre de protection des données UE–États-Unis) ou sur les clauses contractuelles types, complétées de mesures de sécurité. Tu peux obtenir une copie des garanties applicables en écrivant à l'Éditeur.</p>

<h3>6. Tes droits</h3><p>Tu disposes des droits : d'accès, de rectification, d'effacement, de limitation, d'opposition (pour les traitements fondés sur l'intérêt légitime), de portabilité, de retrait de ton consentement le cas échéant, et de définir des directives sur le sort de tes données après ton décès.</p>
<p><b>Comment les exercer</b> : l'export (fichier JSON) et la suppression du compte sont directement disponibles dans « Compte ». Tu peux aussi écrire à ${esc(EDITEUR.email)}. Réponse sous un mois, prolongeable de deux mois pour les demandes complexes, avec information dans le premier mois. Une pièce justificative peut être demandée en cas de doute raisonnable sur ton identité.</p>
<p><b>Réclamation</b> : tu peux saisir la CNIL, 3 place de Fontenoy, TSA 80715, 75334 Paris Cedex 07 (cnil.fr), ou l'autorité de protection des données de ton pays de résidence.</p>
<h3>7. Mineurs</h3><p>Le service est réservé aux personnes de 15 ans ou plus. Un compte créé par une personne plus jeune sera supprimé dès que l'Éditeur en a connaissance. Les parents peuvent le signaler à l'adresse de contact.</p>

/* ====== Animations et fenêtres ====== */
let splashPending=false, pendingFn=null;
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const afterSplash = f => { if(document.getElementById("splash")) pendingFn=f; else f() };
function showSplash(name){
 if(document.getElementById("splash")) return;
 const d=document.createElement("div"); d.id="splash";
 d.innerHTML=`<div class="sp-in"><div class="sp-ring"><svg viewBox="0 0 96 96" fill="none"><circle cx="48" cy="48" r="42" stroke="rgba(255,255,255,.25)" stroke-width="6"/><circle class="arc" cx="48" cy="48" r="42" stroke="#2de0b0" stroke-width="6" stroke-linecap="round" stroke-dasharray="70 200"/><path d="M52 22 34 52h13l-4 22 21-32H51z" fill="#fff"/></svg></div><div class="sp-hello">Bonjour${name?",<br>"+esc(name):""}</div><div class="sp-bar"><i></i></div><div class="sp-msg" id="spm">Récupération de tes trottinettes…</div><div class="sp-skip">Touche l'écran pour passer</div></div>`;
 document.body.appendChild(d);
 const say=t=>setTimeout(()=>{const m=document.getElementById("spm"); if(m) m.textContent=t},0);
 const t1=setTimeout(()=>say("Calcul de tes rappels…"),1700), t2=setTimeout(()=>say("Ton carnet est prêt !"),3400); let done=false, t3;
 const end=()=>{if(done) return; done=true; clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); d.classList.add("out");
  setTimeout(()=>{d.remove(); if(pendingFn){const f=pendingFn; pendingFn=null; f()}},500)};
 t3=setTimeout(end,5000); d.onclick=end;
}
function countUp(el){
 const to=+el.textContent; if(!to||REDUCED) return; const t0=performance.now(); el.textContent=0;
 const f=t=>{const p=Math.min(1,(t-t0)/900); el.textContent=Math.round(to*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(f)}; requestAnimationFrame(f);
}
async function pkCheck(){
 sessionStorage.setItem("pk_shown","1");
 try{ if(sb.auth.passkey&&sb.auth.passkey.list){const {data}=await sb.auth.passkey.list(); if(data&&data.length) return} }catch(e){}
 afterSplash(askPasskey);
}
function askPasskey(){
 if(document.getElementById("pkm")||!user) return;
 const m=document.createElement("div"); m.id="pkm"; m.className="modal"; m.setAttribute("role","dialog"); m.setAttribute("aria-modal","true"); m.setAttribute("aria-labelledby","pkt");
 m.innerHTML=`<div class="sheet"><div class="ico big">${KEY}</div><h2 id="pkt">Connecte-toi plus vite avec une passkey</h2><p>Une passkey remplace ton mot de passe : tu te connectes avec ton empreinte, ton visage ou le code de ton appareil. C'est plus rapide et plus sûr, car il n'y a rien à retenir et rien qui puisse être volé ou deviné.</p><p class="mute">Tu pourras aussi en ajouter une plus tard depuis Compte.</p><label class="chk"><input type="checkbox" id="pkX"><span>Ne plus me le proposer</span></label><div class="btnrow"><button id="pkY">Ajouter une passkey</button><button class="sec" id="pkN">Plus tard</button></div></div>`;
 document.body.appendChild(m);
 const kd=e=>{if(e.key==="Escape") close()};
 const close=()=>{if($("#pkX")&&$("#pkX").checked) localStorage.setItem("pk_never_"+user.id,"1"); m.remove(); document.removeEventListener("keydown",kd)};
 document.addEventListener("keydown",kd);
 $("#pkN").onclick=close; m.addEventListener("click",e=>{if(e.target===m) close()});
 $("#pkY").onclick=async()=>{const {error}=await sb.auth.registerPasskey(); close(); toast(error?"Passkey : "+error.message:"Passkey ajoutée.")};
 $("#pkY").focus();
}

/* ====== Démarrage ====== */
if(!localStorage.getItem("ck")) $("#cookie").style.display="block";
sb.auth.onAuthStateChange((ev,session)=>{user=session?session.user:null; if(ev==="SIGNED_IN"&&/connexion|inscription|bienvenue/.test(location.hash)) location.hash="#/accueil"; if(ev==="SIGNED_IN"&&!REDUCED&&!sessionStorage.getItem("splash")){sessionStorage.setItem("splash","1"); splashPending=true}
 if(ev==="SIGNED_OUT"){sessionStorage.removeItem("splash"); sessionStorage.removeItem("pk_shown"); location.hash="#/bienvenue"} route()});
</script>
